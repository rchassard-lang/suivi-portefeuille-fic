<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FIC Structured Asset Allocation (SAA) — Suivi Portefeuille</title>
<style>
  :root{ --ink:#0f1b2d; --ink2:#33475b; --muted:#6b7a8d; --line:#e2e8f0; --bg:#f6f8fb; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;font-family:"Inter","Segoe UI",system-ui,sans-serif;background:var(--bg)}
  .bar{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;border-bottom:2px solid var(--ink);background:#fff}
  .tabs{display:flex;gap:6px}
  .tab-btn{font-family:inherit;font-size:13px;font-weight:700;letter-spacing:.03em;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 18px;cursor:pointer}
  .tab-btn.active{background:var(--ink);border-color:var(--ink);color:#fff}
  .frame-wrap{position:relative;height:calc(100vh - 49px)}
  iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:none;display:none}
  iframe.active{display:block}
</style>
</head>
<body>
<div class="bar">
  <div class="tabs">
    <button class="tab-btn active" data-lang="nl">NL</button>
    <button class="tab-btn" data-lang="fr">FR</button>
  </div>
</div>
<div class="frame-wrap">
  <iframe id="frame-nl" class="active" src="nl.html" title="Suivi Portefeuille NL"></iframe>
  <iframe id="frame-fr" src="fr.html" title="Suivi Portefeuille FR"></iframe>
</div>
<script>
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('iframe').forEach(f=>f.classList.remove('active'));
    document.getElementById('frame-'+btn.dataset.lang).classList.add('active');
  });
});
</script>
</body>
</html>
